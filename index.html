<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home | Dubai Youth Economics Review</title>
  <meta name="description" content="Dubai Youth Economics Review — student-led economic journalism. Independent reporting, data, and opinion.">

  <!-- Canonical + social share metadata -->
  <link rel="canonical" href="https://dubaiyoutheconomicsreview.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dubai Youth Economics Review">
  <meta property="og:title" content="Dubai Youth Economics Review">
  <meta property="og:description" content="Student-led economic journalism. Independent reporting, data, and opinion.">
  <meta property="og:url" content="https://dubaiyoutheconomicsreview.app/">
  <meta property="og:image" content="https://dubaiyoutheconomicsreview.app/article_images/uae_free_zones.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dubai Youth Economics Review">
  <meta name="twitter:description" content="Student-led economic journalism. Independent reporting, data, and opinion.">
  <meta name="twitter:image" content="https://dubaiyoutheconomicsreview.app/article_images/uae_free_zones.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
  <style>
    /* ===== Page-specific: Home ===== */

    /* hero */
    .hero{padding:26px 0;background:linear-gradient(180deg, rgba(0,0,0,0.02), transparent)}
    .hero-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:stretch}
    #featureContainer{display:contents}
    .feature{background:#fff;border-radius:2px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.05);display:flex;flex-direction:column;transition:transform 0.15s,box-shadow 0.15s}
    .feature:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.08)}
    .feature-media{width:100%;flex:1;min-height:320px;background:#ddd;overflow:hidden;position:relative;}
    .feature-media img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center;}
    .feature-body{padding:20px;flex-shrink:0;}
    .kicker{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;background:rgba(193,18,31,0.08);padding:2px 8px;border-radius:2px;display:inline-block}
    .feature h1{margin:0 0 8px;font-size:28px;line-height:1.06}
    .byline{color:var(--muted);font-size:13px;margin-bottom:10px}
    .excerpt{margin-bottom:12px;color:#222}
    .read{color:var(--accent);font-weight:700;text-decoration:none}

    /* side highlights */
    .side{display:flex;flex-direction:column;gap:12px}
    .card-sm{background:#fff;padding:10px;border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,0.05);transition:transform 0.15s,box-shadow 0.15s}
    .card-sm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.08)}
    .card-sm-media{height:130px;background:#e8e0d8;border-radius:2px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .card-sm-media img{width:100%;height:100%;object-fit:cover;object-position:center}
    .card-sm h3{margin:0;font-size:15px}
    .card-sm h3 a{color:inherit;text-decoration:none}
    .card-sm h3 a:hover{color:var(--accent)}
    .card-sm p{margin:4px 0 0;color:var(--muted);font-size:12px}

    /* latest */
    .latest{padding:28px 0}
    .latest h2{font-weight:800;font-size:20px;margin:0 0 14px}
    .latest h2::after{content:'';display:block;width:40px;height:3px;background:var(--accent);margin-top:8px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .article-card{background:#fff;border-radius:2px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.05);transition:transform 0.15s,box-shadow 0.15s}
    .article-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.08)}
    .article-card:not(:has(.article-card-media)){border-top:3px solid var(--accent)}
    .article-card-media{height:180px;background:linear-gradient(135deg,#e8e0d8,#d4cdc5);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .article-card-media img{width:100%;height:100%;object-fit:cover;object-position:center}
    .article-card-media svg{width:100%;height:100%}
    .article-card-body{padding:16px}
    .article-card-body .kicker{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;background:rgba(193,18,31,0.08);padding:2px 8px;border-radius:2px;display:inline-block}
    .article-card-body h3{margin:0 0 8px;font-size:17px;line-height:1.25}
    .article-card-body h3 a{color:var(--text);text-decoration:none}
    .article-card-body h3 a:hover{color:var(--accent)}
    .article-card-body .byline{color:var(--muted);font-size:12px;margin-bottom:8px}
    .article-card-body .excerpt{color:#444;font-size:13px;line-height:1.5;margin:0}

    /* responsive */
    @media (max-width:960px){
      .hero-grid{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(2,1fr)}
      .feature h1{font-size:24px}
      .side{flex-direction:row;gap:10px;overflow-x:auto}
      .card-sm{min-width:200px;flex:1}
    }
    @media (min-width:961px) and (max-width:1100px){
      .grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:600px){
      .side{flex-direction:column}
      .card-sm{min-width:auto}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

  <header id="siteHeader"></header>
  <script>DYER.header('home');</script>

  <main>
    <div class="container" style="padding-top:14px; padding-bottom:0">
      <p style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; margin:0;">
        <span id="dateline"></span>
      </p>
    </div>
    <!-- ===== HERO ===== -->
    <section class="hero">
      <div class="container hero-grid">
        <div id="featureContainer"></div>
        <div class="side" id="editorsPicksContainer"></div>
      </div>
    </section>

    <!-- ===== LATEST ARTICLES ===== -->
    <section class="latest">
      <div class="container">
        <h2>Latest Articles</h2>
        <div class="grid" id="latestGrid">
          <!-- Filled dynamically from JSON -->
        </div>
        <div style="text-align:right; margin-top:12px;">
          <a href="/articles" style="color:var(--accent); font-weight:700; font-size:13px; text-decoration:none;">View all articles &rarr;</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter" class="site-footer" role="contentinfo"></footer>
  <script>DYER.footer();</script>

  <script>
    // Dateline
    document.getElementById('dateline').textContent = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

    // Latest Articles from JSON (rendered only from the live fetch — no cache)
    (function(){
      var JSON_URL = '/articles.json';
      var grid = document.getElementById('latestGrid');
      var featureContainer = document.getElementById('featureContainer');
      var editorsPicksContainer = document.getElementById('editorsPicksContainer');

      function parseDate(s){
        if(!s) return new Date(0);
        var d=new Date(s);
        if(!isNaN(d)) return d;
        return new Date(0);
      }

      function esc(s){
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
      }

      function isTrueFlag(v){
        return String(v || '').trim().toLowerCase() === 'true';
      }

      function hrefFor(a){ return DYER.articleHref(a, a._idx, false); }

      function renderFeature(articles){
        if(!featureContainer) return;
        var special = articles.filter(function(a){ return isTrueFlag(a.special_report); });
        if(special.length === 0){
          featureContainer.innerHTML = '<article class="feature" aria-label="Featured article"><div class="feature-body"><p style="color:#C1121F;font-weight:700;">⚠ No Special Report set. Add special_report = true to exactly one entry in articles.json.</p></div></article>';
          return;
        }
        if(special.length > 1){
          featureContainer.innerHTML = '<article class="feature" aria-label="Featured article"><div class="feature-body"><p style="color:#C1121F;font-weight:700;">⚠ Multiple Special Reports found. Only one entry should have special_report = true.</p></div></article>';
          return;
        }
        var a = special[0];
        var hasImg = !!(a.image && a.image.trim());
        var mediaHTML = hasImg ? '<div class="feature-media"><img src="' + esc(a.image.trim()) + '" alt="' + esc(a.title || '') + '"></div>' : '<div class="feature-media"></div>';
        var byline = 'By ' + esc(a.author || '') + ' • ' + esc(a.date || '');
        featureContainer.innerHTML =
          '<article class="feature" aria-label="Featured article">' +
            mediaHTML +
            '<div class="feature-body">' +
              '<div class="kicker">Special Report</div>' +
              '<h1>' + esc(a.title || '') + '</h1>' +
              '<p class="byline">' + byline + '</p>' +
              '<p class="excerpt">' + esc(a.excerpt || '') + '</p>' +
              '<a href="' + hrefFor(a) + '" class="read">Read the full story →</a>' +
            '</div>' +
          '</article>';
      }

      function renderEditorsPicks(articles){
        if(!editorsPicksContainer) return;
        var picks = articles.filter(function(a){ return isTrueFlag(a.editors_pick); });
        if(picks.length === 0){
          editorsPicksContainer.innerHTML = '<p style="color:#C1121F;font-weight:700;">⚠ No Editor\'s Picks set. Add editors_pick = true to up to three entries in articles.json.</p>';
          return;
        }
        if(picks.length > 3){
          editorsPicksContainer.innerHTML = '<p style="color:#C1121F;font-weight:700;">⚠ Too many Editor\'s Picks. Only 3 entries should have editors_pick = true — currently found ' + picks.length + '.</p>';
          return;
        }
        editorsPicksContainer.innerHTML = picks.map(function(a){
          var hasImg = a.image && a.image.trim();
          var mediaHTML = hasImg
            ? '<div class="card-sm-media"><img src="' + esc(a.image.trim()) + '" alt="' + esc(a.title || '') + '"></div>'
            : '<div class="card-sm-media"></div>';
          return '<div class="card-sm">' +
            mediaHTML +
            '<div class="kicker" style="font-size:10px; margin-bottom:6px;">Editor\'s Pick</div>' +
            '<h3><a href="' + hrefFor(a) + '">' + esc(a.title || '') + '</a></h3>' +
            '<p>' + esc(a.excerpt || '') + '</p>' +
            '<p style="color:var(--muted);font-size:11px;margin:4px 0 0;">' + esc(a.read_time || '3 min read') + '</p>' +
          '</div>';
        }).join('');
      }

      function buildCard(a){
        var hasImg = a.image && a.image.trim();
        var mediaHTML = hasImg
          ? '<div class="article-card-media"><img src="'+esc(a.image.trim())+'" alt="'+esc(a.title || '')+'" loading="lazy"></div>'
          : '';
        var kicker = (a.tagline || a.category || '').trim();
        return '<div class="article-card">'+mediaHTML+'<div class="article-card-body">'+
          '<div class="kicker">'+esc(kicker)+'</div>'+
          '<h3><a href="'+hrefFor(a)+'">'+esc(a.title || '')+'</a></h3>'+
          '<p class="byline">By '+esc(a.author || '')+' — '+esc(a.date || '')+'</p>'+
          '<p class="excerpt">'+esc(a.excerpt || '')+'</p>'+
          '</div></div>';
      }

      function renderFromJSON(data){
        var list = Array.isArray(data) ? data : [];
        var articles = list.map(function(item, idx){
          var obj = Object.assign({}, item);
          obj._idx = idx;
          obj._date = parseDate(obj.date);
          return obj;
        }).filter(function(a){ return a.title; });
        renderFeature(articles);
        renderEditorsPicks(articles);
        articles.sort(function(a,b){return b._date-a._date;});
        var html='';
        var count=Math.min(articles.length,4);
        for(var k=0;k<count;k++) html+=buildCard(articles[k]);
        grid.innerHTML=html;
      }

      fetch(JSON_URL)
        .then(function(r){
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data){
          renderFromJSON(data);
        })
        .catch(function(){
          grid.innerHTML = '<p style="color:var(--muted); font-size:14px;">Articles coming soon.</p>';
          renderFeature([]);
          renderEditorsPicks([]);
        });
    })();
  </script>
</body>
</html>
